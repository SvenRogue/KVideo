name: Disconnect Legacy Cloudflare Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disconnect:
    runs-on: ubuntu-latest
    steps:
      - name: Disconnect legacy Workers Builds trigger
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: 2436df498e34aef84f6add92284ef920
          WORKER_TAG: 0414af93e5e6461193887dca42709be7
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/workers/$WORKER_TAG/triggers")
          mapfile -t trigger_ids < <(jq -r '.result[] | (.id // .uuid // .trigger_uuid) // empty' <<<"$response")
          if [ "${#trigger_ids[@]}" -eq 0 ]; then
            echo "No legacy Workers Builds trigger remains."
            exit 0
          fi
          for trigger_id in "${trigger_ids[@]}"; do
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/builds/triggers/$trigger_id" \
              | jq -e '.success == true' >/dev/null
          done
          echo "Disconnected ${#trigger_ids[@]} legacy Workers Builds trigger(s)."
